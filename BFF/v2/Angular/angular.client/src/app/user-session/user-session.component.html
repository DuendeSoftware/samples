<h1 id="tableLabel">User Session</h1>

@if (isAnonymous$ | async) {
  <p><em>Loading...</em></p>
}

@if (isAuthenticated$ | async) {
  <table class='table table-striped' aria-labelledby="tableLabel">
    <thead>
      <tr>
        <th>Type</th>
        <th>Value(C)</th>
      </tr>
    </thead>
    <tbody>
      @for (claim of session$ | async; track claim) {
        <tr>
          <td>{{ claim.type }}</td>
          <td>{{ claim.value }}</td>
        </tr>
      }
    </tbody>
  </table>
}
