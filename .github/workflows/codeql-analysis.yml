# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
name: "CodeQL"

on:
  push:
    branches: [ main ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ main ]
  schedule:
    - cron: '34 0 * * 5'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }}, ${{ matrix.shard }})
    runs-on:
      group: Large
      labels: [ubuntu-latest-x64-16core]

    strategy:
      fail-fast: false
      # C# is split by sample folder so dependency restore and extraction run in parallel.
      # Each shard uploads results under its own category.
      matrix:
        include:
          - language: csharp
            shard: IdentityServer/v7
          - language: csharp
            shard: IdentityServer/v8
          - language: csharp
            shard: BFF
          - language: csharp
            shard: various
          - language: javascript
            shard: all

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # build-mode none restores NuGet packages into a temp dir via `dotnet restore --packages`,
    # ignoring ~/.nuget/packages. CODEQL_EXTRACTOR_CSHARP_OPTION_BUILDLESS_DEPENDENCY_DIR (set on
    # the analyze step) makes it use a persistent dir instead, which is cached here per shard.
    - name: Cache CodeQL C# dependencies
      if: matrix.language == 'csharp'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/codeql-csharp-deps
        key: codeql-csharp-deps-${{ runner.os }}-${{ matrix.shard }}-${{ hashFiles(format('{0}/**/*.csproj', matrix.shard), format('{0}/**/Directory.Packages.props', matrix.shard), format('{0}/**/Directory.Build.props', matrix.shard), format('{0}/**/packages.config', matrix.shard), format('{0}/**/nuget.config', matrix.shard), 'global.json', 'nuget.config') }}
        restore-keys: |
          codeql-csharp-deps-${{ runner.os }}-${{ matrix.shard }}-

    # Analysis runs without compiling the samples; compilation is verified by the Build workflow.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@9e8d0789d4a0fa9ceb6b1738f7e269594bdd67f0
      with:
        languages: ${{ matrix.language }}
        build-mode: none
        source-root: ${{ matrix.shard == 'all' && '.' || matrix.shard }}
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.
        # queries: ./path/to/local/query, your-org/your-repo/queries@main

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@9e8d0789d4a0fa9ceb6b1738f7e269594bdd67f0
      env:
        CODEQL_EXTRACTOR_CSHARP_OPTION_BUILDLESS_DEPENDENCY_DIR: ${{ matrix.language == 'csharp' && format('{0}/codeql-csharp-deps', runner.temp) || '' }}
      with:
        # JavaScript keeps its pre-sharding default category so existing alerts continue to update.
        category: ${{ matrix.language == 'javascript' && '.github/workflows/codeql-analysis.yml:analyze/language:javascript/' || format('/language:{0}/{1}', matrix.language, matrix.shard) }}
