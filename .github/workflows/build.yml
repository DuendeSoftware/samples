name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  discover:
    name: Discover samples
    runs-on: ubuntu-latest
    outputs:
      dotnet: ${{ steps.discover.outputs.dotnet }}
      node: ${{ steps.discover.outputs.node }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Discover solutions and npm projects
        id: discover
        run: dotnet run .github/scripts/discover-builds.cs

  dotnet:
    name: ${{ matrix.path }}
    needs: discover
    # Windows jobs (MAUI, .NET Framework) run on a 16-core larger runner from the org's "Large" runner group.
    runs-on: ${{ matrix.os == 'windows-latest' && fromJSON('{"group":"Large","labels":["windows-latest-x64-16core"]}') || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.dotnet) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build
        if: matrix.kind == 'sdk'
        run: dotnet build "${{ matrix.path }}" -c Release

      - name: Install MAUI workload
        if: matrix.kind == 'maui'
        run: dotnet workload install maui

      - name: Build (MAUI)
        if: matrix.kind == 'maui'
        run: dotnet build "${{ matrix.path }}" -c Release -f "${{ matrix.framework }}"

      - name: Setup MSBuild
        if: matrix.kind == 'netfx'
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - name: Setup NuGet
        if: matrix.kind == 'netfx'
        uses: NuGet/setup-nuget@fd55a6f3b34392fa83fde1454582407d8c714123 # v4.0

      - name: Build (.NET Framework)
        if: matrix.kind == 'netfx'
        run: |
          nuget restore "${{ matrix.path }}"
          msbuild "${{ matrix.path }}" -p:Configuration=Release -m

  node:
    name: ${{ matrix.path }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.node) }}
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.path }}/package-lock.json

      # The Vite configs export an ASP.NET Core dev certificate via `dotnet dev-certs` when loaded.
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Prepare dev certificate folders
        run: mkdir -p "$HOME/.aspnet/https" "$HOME/.aspnet/dev-certs/https"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  build-result:
    name: Build result
    needs: [ dotnet, node ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check build results
        env:
          DOTNET_RESULT: ${{ needs.dotnet.result }}
          NODE_RESULT: ${{ needs.node.result }}
        run: |
          echo "dotnet: $DOTNET_RESULT"
          echo "node: $NODE_RESULT"
          [[ "$DOTNET_RESULT" == "success" && "$NODE_RESULT" == "success" ]]
